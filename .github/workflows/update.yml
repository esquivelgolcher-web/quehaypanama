name: Actualizar y publicar

# Se ejecuta cada 3 horas, y tambien manualmente desde la pestaña "Actions".
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/archive.json"
      - "README.md"

# Permisos: escribir en el repo (para guardar el historial) y publicar en Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Evita que dos ejecuciones pisen el despliegue a la vez.
concurrency:
  group: quehaypanama
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generar el sitio
        run: node src/build.mjs

      - name: Guardar el historial de noticias
        run: |
          git config user.name "quehay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
          else
            git commit -m "Historial: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Empaquetar para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
